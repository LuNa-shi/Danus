<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Danus Web Console</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>Danus Web Console</h1><span id="auth-state">未登录</span><button id="logout" hidden>退出</button></header><main><section id="login-panel"><h2>登录</h2><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="应用密码" required><button>登录</button></form><p id="login-error" class="error"></p></section><section id="console" hidden><aside><h2>Projects</h2><form id="project-form"><input id="project-name" placeholder="Project 名称" required><textarea id="problem" placeholder="数学问题" required></textarea><input id="roles" value="high:1,xhigh:1" aria-label="Worker roster"><button>创建 Project</button></form><ul id="project-list"></ul></aside><section id="project-view"><p>请选择一个 Project。</p></section></section></main><script src="/static/app.js"></script></body></html>
